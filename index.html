<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdaptiveSpace — Study Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Light mode (default) */
:root{--bg:#FAF9F6;--surface:#FFFFFF;--text:#333333;--text-muted:#5F6B76;--accent:#1D4E89;--accent-hover:#163A66;--on-accent:#FFFFFF;--success:#2E7D32;--warning:#B45309;--error:#B3261E;--border:#E3E0D8;--focus:#1D4E89;color-scheme:light;
--fh:'Lexend',system-ui,sans-serif;--fb:'Atkinson Hyperlegible',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Derived from the tokens above so they follow light/dark automatically.
   --border is only a soft divider (1.25:1), so anything you tap or type in uses --control (3:1+) instead. */
:root{--control:color-mix(in srgb,var(--text-muted) 75%,var(--bg));--track:color-mix(in srgb,var(--text) 14%,var(--surface));--alt:color-mix(in srgb,var(--text) 6%,var(--surface));--accent-soft:color-mix(in srgb,var(--accent) 10%,var(--surface));--success-soft:color-mix(in srgb,var(--success) 10%,var(--surface));--warning-soft:color-mix(in srgb,var(--warning) 10%,var(--surface))}
/* Dark mode: follows the system unless the toggle says otherwise */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1E1E;--surface:#262626;--text:#E0E0E0;--text-muted:#A3A3A3;--accent:#7FA9DB;--accent-hover:#93BCE6;--on-accent:#1E1E1E;--success:#81C784;--warning:#E8B44A;--error:#F28B82;--border:#3A3A3A;--focus:#8AB4F8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1E1E;--surface:#262626;--text:#E0E0E0;--text-muted:#A3A3A3;--accent:#7FA9DB;--accent-hover:#93BCE6;--on-accent:#1E1E1E;--success:#81C784;--warning:#E8B44A;--error:#F28B82;--border:#3A3A3A;--focus:#8AB4F8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--fb);transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
::placeholder{color:var(--text-muted);opacity:1}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;max-width:1120px;margin:0 auto}
.brand{font:600 19px var(--fh)}.brand span{color:var(--accent)}
.tg{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-muted)}
.switch{position:relative;width:46px;height:26px;background:var(--control);border-radius:20px;border:0;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch[aria-pressed=true]{background:var(--accent)}.switch[aria-pressed=true]::after{left:23px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 1px 3px color-mix(in srgb,var(--text) 8%,transparent)}
h2{font:600 17px var(--fh);margin:0 0 12px}
.stats{display:flex;gap:18px;align-items:center;margin:20px 0;flex-wrap:wrap}
.owl{width:52px;height:52px;flex-shrink:0}
.lvl{font:700 20px var(--fh)}
.xpw{flex:1;min-width:200px}.xpw small{color:var(--text-muted);font-size:13px}
.track{height:12px;background:var(--track);border-radius:8px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--accent);border-radius:8px;transition:width .45s}
.streak{font:600 18px var(--fh);color:var(--warning);white-space:nowrap}
.badges{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.bd{font-size:12.5px;padding:3px 10px;border-radius:20px;border:1px dashed var(--control);color:var(--text-muted)}
.bd.on{background:var(--warning-soft);border:1px solid var(--warning);color:var(--text);font-weight:700}
.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start;padding-bottom:48px}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.stack{display:grid;gap:20px}
.two{display:grid;grid-template-columns:1fr;gap:20px} /* stacked: side-by-side squeezed task names into mid-word breaks */
.qa{display:grid;gap:8px}
.qa .row{display:flex;gap:8px}
.qa .row .btn{flex:1}
#micBtn.on{background:var(--warning-soft);border-color:var(--warning);color:var(--text)}
input,select,textarea{background:var(--bg);border:1px solid var(--control);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{min-height:130px;resize:vertical;font-size:15px}
.btn{font:600 14px var(--fh);padding:10px 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--on-accent);width:auto}
.btn:hover{background:var(--accent-hover)}
.btn.g{background:transparent;border-color:var(--control);color:var(--text)}
.btn.g:hover{background:var(--accent-soft)}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:14px;color:var(--text-muted)}
.flt select{width:auto;padding:6px 8px}
ul{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;padding:9px 10px;margin-bottom:8px;background:var(--bg)}
.task.done{background:var(--success-soft)}.task.done .tn{text-decoration:line-through;color:var(--text-muted)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--control);background:none;color:transparent;cursor:pointer;flex-shrink:0;font-size:13px;padding:0}
.done .ck{background:var(--success);border-color:var(--success);color:var(--on-accent)}
.tt{flex:1;min-width:0}.tn{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:12px;padding:1px 9px;border-radius:20px;background:var(--alt);border:1px solid var(--border);color:var(--text-muted)}
.chip.od{background:var(--warning-soft);color:var(--text);border-color:var(--warning)}
.p-high{background:var(--warning-soft);color:var(--text);border-color:var(--warning)}.p-medium{background:var(--accent-soft);color:var(--text);border-color:var(--accent)}
.ib{background:none;border:0;cursor:pointer;color:var(--text-muted);font-size:16px;padding:4px 6px;border-radius:6px}
.ib:hover{color:var(--accent)}.ib[data-a=d]:hover{color:var(--error)}
.empty,.note{color:var(--text-muted);font-size:14.5px;padding:6px 2px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs .tab{flex:1;min-width:110px}
.tab{flex:1;padding:8px;border-radius:10px;border:1px solid var(--control);background:none;cursor:pointer;font:600 14px var(--fh)}
.tab:hover{background:var(--accent-soft)}
.tab[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.row input[type=file]{font-size:13px;flex:1;border:0;padding:0;background:none}
#cvOut{margin-top:14px}
#cvOut svg{width:100%;height:auto;background:var(--alt);border-radius:12px}
.bul{padding-left:0}.bul li{padding:8px 12px;margin-bottom:6px;background:var(--accent-soft);border-radius:10px;font-size:15.5px}
ol.bul{padding-left:26px}ol.bul li{padding:8px 12px 8px 4px}
#tts{display:none;margin-top:10px;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
#tts select{width:auto;padding:6px 8px}#tts input{width:110px;padding:0}
#speak.on{background:var(--warning-soft);border-color:var(--warning);color:var(--text)}
#songBtn.on{background:var(--warning-soft);border-color:var(--warning);color:var(--text)}
#dumpListen.on{background:var(--warning-soft);border-color:var(--warning);color:var(--text)}
.toast{position:fixed;bottom:20px;right:20px;max-width:290px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 30px 12px 12px;box-shadow:0 14px 34px rgba(0,0,0,.2);display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(14px);pointer-events:none;transition:.3s;z-index:60;font-size:14px}
.toast.show{opacity:1;transform:none;pointer-events:auto}.toast .owl{width:40px;height:40px}
.toast b{display:block;font-family:var(--fh)}
.toast button{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--text-muted);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:70;opacity:0;visibility:hidden;transition:.25s}
.ov.show{opacity:1;visibility:visible}
.cel{background:var(--surface);border-radius:20px;padding:30px;max-width:330px;text-align:center}
.cel .owl{width:84px;height:84px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.cel h3{font:600 22px var(--fh);margin:10px 0 6px}.cel p{color:var(--text-muted);margin:0 0 18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.cel .owl{animation:none}}
body{zoom:var(--fs,1);line-height:var(--lh,1.5);letter-spacing:var(--ls,0)}
body.lexend{--fb:var(--fh)}
.cf{position:relative}.cf summary{cursor:pointer;font:600 14px var(--fh);padding:6px 12px;border:1px solid var(--control);border-radius:10px;list-style:none;color:var(--text)}
.cfp{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:grid;gap:10px;width:260px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.15);color:var(--text)}
.cfp .btn{padding:6px 12px}.cfp label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text)}.cfp input{width:auto}
.next{border:2px solid var(--accent);margin-bottom:20px}
.big{font:700 clamp(22px,3vw,30px)/1.25 var(--fh);margin:4px 0 8px;overflow-wrap:anywhere}
.steps .step{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--bg)}
.step.done{background:var(--success-soft)}.step.done .tn{text-decoration:line-through;color:var(--text-muted)}.step .tn{flex:1;font-weight:400}
.row select{width:auto}
body.calm .layout{grid-template-columns:1fr;max-width:720px;margin:0 auto}
body.calm .two{grid-template-columns:1fr}
body.calm .two>section:nth-child(2),body.calm .stack>section:last-child,body.calm aside{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="owl" viewBox="0 0 60 60"><ellipse cx="30" cy="34" rx="20" ry="18" fill="var(--accent)"/><circle cx="30" cy="16" r="13" fill="var(--accent)"/><path d="M30 16L42 20L30 24Z" fill="var(--warning)"/><circle cx="24" cy="14" r="3" fill="#fff"/><circle cx="24" cy="14" r="1.4" fill="#222"/><path d="M14 30Q6 26 8 38Q16 40 20 32Z" fill="var(--warning)"/><path d="M18 46Q30 54 42 46" stroke="var(--warning)" stroke-width="3" fill="none" stroke-linecap="round"/></symbol></svg>

<header><div class="bar"><div class="brand">Adaptive<span>Space</span></div>
<div class="tg"><details class="cf"><summary>⚙ Comfort</summary><div class="cfp">
<button class="btn g" id="cFont">Font</button>
<span>Text size <button class="btn g" id="cMinus" aria-label="Smaller text">A−</button> <button class="btn g" id="cPlus" aria-label="Bigger text">A+</button></span>
<label><input type="checkbox" id="cSpace"> Roomy spacing</label>
<label><input type="checkbox" id="cCalm"> Calm view: one thing at a time</label>
<label style="display:block">AI (optional)<input type="password" id="aiKey" placeholder="Anthropic API key" autocomplete="off"></label>
<p class="note" style="font-size:12px;margin:0">Powers AI step breakdowns &amp; the Simplify/Instructions tabs. Stored only in your browser, sent only to Anthropic.</p></div></details><label for="zen">Dark Mode</label><button id="zen" class="switch" role="switch" aria-pressed="false" aria-label="Toggle dark mode"></button></div></div></header>

<main class="wrap">
  <section class="card stats" aria-label="Progress">
    <svg class="owl" aria-hidden="true"><use href="#owl"/></svg>
    <div><div class="lvl" id="lvl">Level 1</div></div>
    <div class="xpw"><small id="xpTxt">0 / 100 XP</small><div class="track"><div class="fill" id="fill"></div></div></div>
    <div class="streak" id="streak">🔥 0 day streak</div>
    <div class="badges" id="badges"></div>
  </section>

  <section class="card next" aria-label="Next step">
  <div id="nextBody"></div>
  <div class="row"><button class="btn" id="doneBtn">✓ Done</button><button class="btn g" id="readBtn">🔊 Read to me</button><button class="btn g" id="skipBtn">↻ Not this one</button></div>
</section>
<div class="layout">
    <div class="stack">
      <section class="card">
        <h2>Task dump</h2>
        <div class="qa">
          <input id="tTitle" placeholder="Dump it here — assignment, exam, reading… then press Enter" aria-label="Task title">
          <div class="row"><button class="btn g" id="micBtn" type="button" aria-label="Speak a task">🎤 Speak</button><button class="btn" id="addBtn">Add</button></div>
        </div>
        <div class="row" style="margin-top:10px"><button class="btn g" id="dumpListen">🔊 Listen to your tasks</button></div>
        <datalist id="subs"></datalist>
      </section>

      <div class="two">
        <section class="card"><h2>Today</h2><ul id="today"></ul></section>
        <section class="card"><h2>Upcoming deadlines</h2><ul id="upcoming"></ul></section>
      </div>

      <section class="card">
        <h2>All tasks</h2>
        <div class="flt">
          <label><input type="checkbox" id="hideDone" style="width:auto"> Hide done</label>
        </div>
        <ul id="all"></ul>
      </section>
    </div>

    <aside class="card" id="converter" style="position:sticky;top:76px">
      <h2>Study material converter</h2>
      <textarea id="cvText" placeholder="Paste your notes here, or upload a file below…" aria-label="Study material"></textarea>
      <div class="row"><input type="file" id="file" accept=".txt,.md,.pdf,.pptx,.jpg,.jpeg,.png,.webp" aria-label="Upload notes, PDF, PowerPoint, or photo of notes"></div>
      <div class="tabs" style="margin-top:12px" role="tablist">
        <button class="tab" role="tab" data-m="map" aria-selected="true">🗺 Diagram</button>
        <button class="tab" role="tab" data-m="listen" aria-selected="false">🔊 Listen &amp; Read</button>
        <button class="tab" role="tab" data-m="simplify" aria-selected="false">✨ Simplify</button>
        <button class="tab" role="tab" data-m="instr" aria-selected="false">📋 Instructions</button>
        <button class="tab" role="tab" data-m="song" aria-selected="false">🎵 Song</button>
      </div>
      <button class="btn" id="convert" style="width:100%">Convert</button>
      <div id="cvOut" aria-live="polite"></div>
      <div id="tts">
        <button class="btn g" id="speak">🔊 Listen</button>
        <label>Read <select id="src"><option value="sum">summary</option><option value="full">full notes</option></select></label>
        <label>Speed <input type="range" id="rate" min="0.6" max="1.6" step="0.1" value="1"> <span id="rateTxt">1.0×</span></label>
      </div>
    </aside>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><button id="toastX" aria-label="Dismiss">✕</button><svg class="owl" aria-hidden="true"><use href="#owl"/></svg><div><b id="toastT"></b><span id="toastM"></span></div></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="celT"><div class="cel"><svg class="owl" aria-hidden="true"><use href="#owl"/></svg><h3 id="celT"></h3><p id="celM"></p><button class="btn" id="celX">Keep going</button></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const today=()=>addDays(0);

/* ---------- state ---------- */
let S={tasks:[],xp:0,streak:0,last:'',total:0,badges:[],nid:1,seeded:0};
try{const r=localStorage.getItem('adsp');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('adsp',JSON.stringify(S))}catch(e){}};
if(!S.seeded){S.seeded=1;S.nid=5;S.tasks=[
 {id:1,title:'Implement stack push/pop logic',sub:'Data Structures',due:today(),pri:'high',done:false},
 {id:2,title:'Read chapter 4 — Cell biology',sub:'Biology',due:today(),pri:'low',done:false},
 {id:3,title:'Lab report draft',sub:'Chemistry',due:addDays(2),pri:'medium',done:false},
 {id:4,title:'Midterm exam',sub:'Data Structures',due:addDays(6),pri:'high',done:false}]}
if(S.last&&S.last!==today()&&S.last!==addDays(-1))S.streak=0;

/* ---------- gamification ---------- */
const lvlOf=()=>1+Math.floor(S.xp/100);
const BADGES=[['first','First step',()=>S.total>=1],['five','5 tasks done',()=>S.total>=5],['l3','Level 3',()=>lvlOf()>=3],['s3','3-day streak',()=>S.streak>=3]];
let tt;
function toast(t,m){$('toastT').textContent=t;$('toastM').textContent=m;$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),4200)}
function celebrate(t,m){$('celT').textContent=t;$('celM').textContent=m;$('ov').classList.add('show');$('celX').focus()}
function award(n){const before=lvlOf();S.xp=Math.max(0,S.xp+n);const after=lvlOf();
 if(after>before)celebrate('Level '+after+'! 🎉','You reached level '+after+'. Keep the streak alive.');
 BADGES.forEach(([id,name,ok])=>{if(!S.badges.includes(id)&&ok()){S.badges.push(id);toast('Badge unlocked!',name)}})}
function touchStreak(){const t=today();if(S.last!==t){S.streak=S.last===addDays(-1)?S.streak+1:1;S.last=t}}

/* ---------- AI (optional, bring-your-own-key) ---------- */
const AIK=()=>{try{return localStorage.getItem('adsp_ai_key')||''}catch(e){return ''}};
async function askAI(prompt,max){
 const key=AIK();if(!key)return null;
 try{
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:max||600,messages:[{role:'user',content:prompt}]})});
  if(!r.ok)return null;
  const d=await r.json();
  return (d.content||[]).map(c=>c.text||'').join('').trim()||null;
 }catch(e){return null}
}
async function aiSteps(t){
 const res=await askAI(`Break the task "${t.title}"${t.sub&&t.sub!=='General'?' (subject: '+t.sub+')':''} into exactly 4 tiny, concrete steps for someone with ADHD and executive dysfunction. Rules: each step under 15 minutes, a specific physical action (never vague verbs like "work on" or "review"), first step near-zero-effort. Reply with ONLY a JSON array, nothing else, like [{"t":"step text","m":8}].`,400);
 if(!res)return null;
 try{const m=res.match(/\[[\s\S]*\]/);if(!m)return null;
  const arr=JSON.parse(m[0]);if(!Array.isArray(arr)||!arr.length)return null;
  return arr.slice(0,5).map(s=>({t:String(s.t||'').slice(0,140),m:Math.max(1,Math.min(60,+s.m||10)),done:false}))
 }catch(e){return null}
}

/* ---------- tasks ---------- */
const PR={high:0,medium:1,low:2},XPV={high:30,medium:20,low:10};
function dl(d){if(!d)return['No date',''];const n=Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
 return n<0?['Waiting '+(-n)+'d','od']:n===0?['Today','']:n===1?['Tomorrow','']:[new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}),'']}
const row=t=>{const[l,c]=dl(t.due);return `<li class="task${t.done?' done':''}" data-id="${t.id}"><button class="ck" data-a="t" aria-label="Mark done">✓</button><div class="tt"><div class="tn">${esc(t.title)}</div><div class="meta"><span class="chip">${esc(t.sub)}</span><span class="chip ${t.done?'':c}">${l}</span><span class="chip p-${t.pri}">${t.pri}</span>${t.steps?`<span class="chip">${t.steps.filter(x=>x.done).length}/${t.steps.length} steps</span>`:''}</div></div><button class="ib" data-a="b" aria-label="Break into tiny steps">✂</button><button class="ib" data-a="e" aria-label="Edit task">✎</button><button class="ib" data-a="d" aria-label="Delete task">✕</button></li>`};
const list=(a,msg)=>a.length?a.map(row).join(''):`<li class="empty">${msg}</li>`;
function render(){
 const T=today(),open=S.tasks.filter(t=>!t.done);
 $('today').innerHTML=list(open.filter(t=>t.due&&t.due<=T).sort((a,b)=>PR[a.pri]-PR[b.pri]),'Nothing due today 🎉');
 $('upcoming').innerHTML=list(open.filter(t=>t.due>T).sort((a,b)=>a.due<b.due?-1:1).slice(0,4),'No upcoming deadlines.');
 const subs=[...new Set(S.tasks.map(t=>t.sub))].sort();

/* ---------- study material converter ---------- */
const STOP=new Set('the and that with this from have will they their there which what when where would could should about into than then them these those been being were also more most some such only other over very your you are for not but can has had was its our out any all one two how why who while between through using used use may must each both'.split(' '));
const sents=t=>t.split(/\n+|(?<=[.!?])\s+/).map(s=>s.replace(/\s+/g,' ').trim()).filter(s=>s.length>3);
const wordsOf=t=>t.toLowerCase().match(/[a-z][a-z'-]{3,}/g)||[];
function freq(t){const f={};wordsOf(t).forEach(w=>{if(!STOP.has(w))f[w]=(f[w]||0)+1});return f}
function summarize(ss,F){const sc=ss.map((s,i)=>{const w=wordsOf(s);return[i,w.reduce((a,x)=>a+(F[x]||0),0)/Math.sqrt(w.length+1)]});
 return sc.sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]).sort((a,b)=>a-b).map(i=>{const w=ss[i].split(' ');return w.length>18?w.slice(0,18).join(' ')+'…':ss[i]})}
function mindmap(ss,kw){
 if(kw.length<2)return '<p class="note">Not enough distinct ideas to map yet — add more text.</p>';
 const cx=290,cy=190,n=kw.length,used=new Set();let L='',N='';
 kw.forEach((k,i)=>{const a=i/n*2*Math.PI-Math.PI/2,bx=cx+125*Math.cos(a),by=cy+85*Math.sin(a),w=k.length*7.5+18;
  L+=`<line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="var(--accent)" stroke-width="2"/>`;
  [-1,1].forEach(o=>{const si=ss.findIndex((s,j)=>!used.has(j)&&s.toLowerCase().includes(k));if(si<0)return;used.add(si);
   const ws=ss[si].split(' '),ix=Math.max(0,ws.findIndex(x=>x.toLowerCase().includes(k)));
   const lab=ws.slice(ix,ix+4).join(' ').replace(/[.,;:]+$/,'').slice(0,20),la=a+o*.32,c=Math.cos(la),lx=cx+180*c,ly=cy+140*Math.sin(la);
   L+=`<line x1="${bx}" y1="${by}" x2="${lx}" y2="${ly}" stroke="var(--warning)" stroke-width="1.2"/>`;
   N+=`<text x="${lx+(c>.25?5:c<-.25?-5:0)}" y="${ly+4}" font-size="11" fill="var(--text)" text-anchor="${c>.25?'start':c<-.25?'end':'middle'}">${esc(lab)}</text>`});
  N+=`<rect x="${bx-w/2}" y="${by-14}" width="${w}" height="28" rx="9" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="${bx}" y="${by+4}" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--text)">${esc(k)}</text>`});
 const ctr=ss[0].split(' ').slice(0,2).join(' ').replace(/[.,;:]+$/,'').slice(0,16);
 return `<svg viewBox="0 0 580 380" role="img" aria-label="Mind map of your notes">${L}<ellipse cx="${cx}" cy="${cy}" rx="56" ry="26" fill="var(--accent)"/><text x="${cx}" y="${cy+4}" font-size="12.5" font-weight="700" text-anchor="middle" fill="var(--on-accent)">${esc(ctr)}</text>${N}</svg>`}

let songAC=null,songTimer=null,songPlaying=false;
function stopSong(){songPlaying=false;if(songTimer){clearInterval(songTimer);songTimer=null}
 if('speechSynthesis' in window)speechSynthesis.cancel();
 if(songAC){try{songAC.close()}catch(e){}songAC=null}
 const b=$('songBtn');if(b){b.textContent='🎵 Play song';b.classList.remove('on')}}
function beat(ac,bpm){
 const dur=60/bpm,chords=[[0,4,7],[5,9,0],[-2,2,7],[3,7,10]];let step=0;
 const tick=()=>{if(!songPlaying)return;const t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2);
  if(step%4===0){const ch=chords[(step/4)%chords.length|0];
   ch.forEach(semi=>{const co=ac.createOscillator(),cg=ac.createGain();co.type='triangle';co.frequency.value=220*Math.pow(2,semi/12);
    cg.gain.setValueAtTime(0,t);cg.gain.linearRampToValueAtTime(.05,t+.05);cg.gain.linearRampToValueAtTime(0,t+dur*4-.05);
    co.connect(cg);cg.connect(ac.destination);co.start(t);co.stop(t+dur*4)})}
  if(step%2===1){const n=ac.sampleRate*.03,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
   for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
   const s=ac.createBufferSource();s.buffer=buf;const hg=ac.createGain();hg.gain.value=.14;s.connect(hg);hg.connect(ac.destination);s.start(t)}
  step++};
 tick();songTimer=setInterval(tick,dur*1000)}
function playSong(lines){
 if(!('speechSynthesis' in window)){toast('Not supported','Singing isn’t available in this browser.');return}
 stopSong();songPlaying=true;const b=$('songBtn');if(b){b.textContent='⏹ Stop song';b.classList.add('on')}
 try{songAC=new(window.AudioContext||window.webkitAudioContext)();beat(songAC,100)}catch(e){}
 const melody=[1.5,1.7,1.9,1.6,1.8,1.4,1.7,1.6];let i=0;
 const next=()=>{if(!songPlaying||i>=lines.length){stopSong();return}
  const u=new SpeechSynthesisUtterance(lines[i]);u.pitch=melody[i%melody.length];u.rate=.82;
  u.onend=u.onerror=()=>{i++;setTimeout(next,150)};speechSynthesis.speak(u)};
 next()}

  $('songBtn').onclick=()=>{if(songPlaying)stopSong();else{playSong(lines);award(8);save();render();toast('Nice!','+8 XP for making a study song.')}};
 } else out.innerHTML=mode==='map'?mindmap(ss,kw):'<ul class="bul">'+SUM.map(s=>`<li>${esc(s)}</li>`).join('')+'</ul>';

const PDF='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function readPdf(f){
 if(!window.pdfjsLib){await new Promise((ok,no)=>{const s=document.createElement('script');s.src=PDF+'pdf.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});pdfjsLib.GlobalWorkerOptions.workerSrc=PDF+'pdf.worker.min.js'}
 const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let o='';
 for(let i=1;i<=Math.min(d.numPages,30);i++){const c=await(await d.getPage(i)).getTextContent();o+=c.items.map(x=>x.str).join(' ')+'\n'}return o}

const JSZ='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
async function readPptx(f){
 if(!window.JSZip)await new Promise((ok,no)=>{const s=document.createElement('script');s.src=JSZ;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
 const zip=await JSZip.loadAsync(await f.arrayBuffer());
 const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
  .sort((a,b)=>(+a.match(/\d+/)[0])-(+b.match(/\d+/)[0]));
 if(!names.length)return '';
 let o='';
 for(let i=0;i<names.length;i++){
  const xml=await zip.files[names[i]].async('string');
  const lines=[...xml.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(m=>m[1]
   .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'"));
  if(lines.length)o+='Slide '+(i+1)+': '+lines.join(' ')+'\n'}
 return o}

const TESS='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js';

 if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement('script');s.src=TESS;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
 const {data}=await Tesseract.recognize(await f.arrayBuffer(),'eng',{logger:m=>{if(onProgress&&m.status==='recognizing text')onProgress(Math.round(m.progress*100))}});
 return data.text}

$('aiKey').onchange=e=>{try{localStorage.setItem('adsp_ai_key',e.target.value.trim())}catch(err){}};

/* ---------- ui chrome ---------- */
$('toastX').onclick=()=>$('toast').classList.remove('show');
$('celX').onclick=()=>$('ov').classList.remove('show');
$('ov').onclick=e=>{if(e.target.id==='ov')$('ov').classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('ov').classList.remove('show')});
$('zen').onclick=()=>{const p=$('zen').getAttribute('aria-pressed')==='true';$('zen').setAttribute('aria-pressed',String(!p));document.documentElement.setAttribute('data-theme',p?'light':'dark')};
if(matchMedia('(prefers-color-scheme:dark)').matches){$('zen').setAttribute('aria-pressed','true');document.documentElement.setAttribute('data-theme','dark')}
applyPref();render();
setTimeout(()=>{const n=S.tasks.filter(t=>!t.done&&t.due&&t.due<=today()).length;toast('Hoot hoot!',n?`You have ${n} task${n>1?'s':''} due today.`:'Nothing due today — nice.')},1200);
</script>
</body>
</html>
